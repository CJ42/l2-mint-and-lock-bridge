name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: 📄 contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Check formatting
        run: forge fmt --check

      - name: Lint contracts
        run: forge lint

      - name: Build contracts
        run: forge build --sizes

      - name: Test contracts
        run: forge test -vvv

  relayer:
    name: ⛽️ relayer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build relayer
        run: bunx turbo run build --filter=@l2-bridge/relayer

      - name: Typecheck relayer
        run: bunx turbo run typecheck --filter=@l2-bridge/relayer

  ui:
    name: 🖥️ ui
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bunx turbo run build --filter=ui

      - name: Typecheck UI
        run: bunx turbo run typecheck --filter=ui
